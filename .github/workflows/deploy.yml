name: Deploy to production

# Every push to master runs the tests; when the repository variable AUTO_DEPLOY is "true" and the secret DEPLOY_SSH_KEY exists,
# the commit is then deployed with deploy/deploy.py (the server re-runs the migrations + all tests on a copy of the live database,
# backs up, applies, reloads, verifies, and rolls back by itself on any failure). Setup: deploy/README.md.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"          # what production runs
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -vi '^uwsgi' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt"
      - name: Game tests
        env:
          REDIS_PORT: "1"                # the tests must not need a Redis
        run: python manage.py test game --noinput
      - name: Deploy tooling tests
        run: python -m unittest deploy.tests.test_release_validation

  deploy:
    needs: test
    if: ${{ vars.AUTO_DEPLOY == 'true' }}
    runs-on: ubuntu-22.04
    environment: production              # add required reviewers in Settings -> Environments if you want a manual approval step
    steps:
      - uses: actions/checkout@v4
      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "::error::the secret DEPLOY_SSH_KEY is not set (see deploy/README.md)"; exit 1; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/acapp_deploy
          chmod 600 ~/.ssh/acapp_deploy
      - name: Deploy
        run: python3 deploy/deploy.py --key ~/.ssh/acapp_deploy
      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/acapp_deploy

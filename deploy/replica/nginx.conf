# Same shape as production's /etc/nginx/nginx.conf (CORS add_header blocks left out).
# `location /static/` has the trailing slash: that is the FIXED form (production still has `location /static {`
# until deploy/fix_nginx is run - see deploy/README.md).
user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 768; }

http {
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    gzip on;

    server {
        listen 80;
        server_name app7562.acapp.acwing.com.cn;
        rewrite ^(.*)$ https://${server_name}$1 permanent;
    }

    server {
        listen 443 ssl;
        server_name app7562.acapp.acwing.com.cn;
        ssl_certificate cert/acapp.pem;
        ssl_certificate_key cert/acapp.key;
        charset utf-8;
        client_max_body_size 10M;

        location / {
            include /etc/nginx/uwsgi_params;
            uwsgi_pass 127.0.0.1:8000;
            uwsgi_read_timeout 60;
        }
        location /static/ {
            alias /home/acs/acapp/static/;
        }
        location /media {
            alias /home/acs/media;
        }
        location /wss {
            proxy_pass http://127.0.0.1:5015;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}

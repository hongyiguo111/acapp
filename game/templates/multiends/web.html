{% load static %}

<head>
    <title>BallBlitz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap-utilities.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/lib/jquery-ui.min.css' %}">
    <script src="{% static 'js/lib/jquery-3.3.1.min.js' %}"></script>
    
    <link rel="stylesheet" href="{% static 'css/chat-field.css' %}">
    <link rel="stylesheet" href="{% static 'css/chatroom.css' %}">
    <link rel="stylesheet" href="{% static 'css/admin-message.css' %}">
    <link rel="stylesheet" href="{% static 'css/leaderboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/menu.css' %}">
    <link rel="stylesheet" href="{% static 'css/announcement.css' %}">
    <link rel="stylesheet" href="{% static 'css/playground.css' %}">
    <link rel="stylesheet" href="{% static 'css/florr.css' %}">
    <link rel="stylesheet" href="{% static 'css/settings.css' %}">
    <link rel="stylesheet" href="{% static 'css/user-settings.css' %}">
    <link rel="stylesheet" href="{% static 'css/media.css' %}">
    <link rel="icon" type="image/png" href="{% static 'image/favicon/favicon.png' %}">

</head>

<body style="margin: 0">
<div id="ac_game_12345678"></div>
<script type="module">
    // bump ?v= whenever dist/game.js changes: nginx sends no cache headers, so browsers would keep an old copy for days
    import {AcGame} from "{% static 'js/dist/game.js' %}?v=florr3";

    $(document).ready(function () {
        let ac_game = new AcGame("ac_game_12345678");
    });
</script>
</body>

# Local development only: Redis for Channels (multiplayer) and django-redis cache.
# Host port 16379 because Windows may reserve 6379 (excluded port range 6288-6387).
# Run Django with REDIS_PORT=16379 (see scripts/dev.ps1).
# Server runs Redis 5.0.7; use the same major version locally.
services:
  redis:
    image: redis:5
    ports:
      - "127.0.0.1:16379:6379"
    restart: unless-stopped
